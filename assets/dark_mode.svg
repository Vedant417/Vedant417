    ASCII Portrait
</text>

<!-- Right Panel (Information) -->
<rect
    x="470"
    y="90"
    width="700"
    height="570"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"/>

<!-- Command 1 -->
<text x="500" y="125"
      fill="#58a6ff"
      font-family="Consolas, monospace"
      font-size="18">$ whoami</text>

<text x="520" y="155"
      fill="#c9d1d9"
      font-family="Consolas, monospace"
      font-size="17">Vedant Vyas</text>

<!-- Command 2 -->
<text x="500" y="205"
      fill="#58a6ff"
      font-family="Consolas, monospace"
      font-size="18">$ cat profile.txt</text>

<text x="520" y="235"
      fill="#8b949e"
      font-family="Consolas, monospace"
      font-size="16">Role       : Full Stack Developer</text>

<text x="520" y="260"
      fill="#8b949e"
      font-family="Consolas, monospace"
      font-size="16">University : VIT Bhopal</text>

<text x="520" y="285"
      fill="#8b949e"
      font-family="Consolas, monospace"
      font-size="16">Company    : Entertainment Technologists</text>

<text x="520" y="310"
      fill="#8b949e"
      font-family="Consolas, monospace"
      font-size="16">Focus      : AI • ML • Full Stack</text>

<!-- Command 3 -->
<text x="500" y="365"
      fill="#58a6ff"
      font-family="Consolas, monospace"
      font-size="18">$ ls skills/</text>

<text x="520" y="395"
      fill="#c9d1d9"
      font-family="Consolas, monospace"
      font-size="16">Python  C++  React  FastAPI</text>

<text x="520" y="420"
      fill="#c9d1d9"
      font-family="Consolas, monospace"
      font-size="16">Node.js  MongoDB  AWS</text>

<!-- Cursor -->
<text x="500" y="485"
      fill="#58a6ff"
      font-family="Consolas, monospace"
      font-size="18">$ █</text>

<!-- Fix bottom corners -->
<rect
    x="5"
    y="42"
    width="1190"
    height="18"
    fill="#161b22"/>

<!-- Window Buttons -->
<circle cx="35" cy="32" r="7" fill="#ff5f56"/>
<circle cx="60" cy="32" r="7" fill="#ffbd2e"/>
<circle cx="85" cy="32" r="7" fill="#27c93f"/>

