<svg
    width="1200"
    height="700"
    viewBox="0 0 1200 700"
    xmlns="http://www.w3.org/2000/svg">
  <rect
    x="5"
    y="5"
    width="1190"
    height="690"
    rx="18"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"/>

  <!-- Terminal Header -->
<rect
    x="5"
    y="5"
    width="1190"
    height="55"
    rx="18"
    fill="#161b22"/>

<!-- Left Panel (ASCII Portrait) -->
<rect
